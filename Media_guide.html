<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>매체 가이드 모음.zip</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
  <!-- ag-psd: 브라우저에서 아트보드 포함 PSD 파일 생성 (전역 agPsd) -->
  <script src="https://cdn.jsdelivr.net/npm/ag-psd@31.0.2/dist/bundle.js"></script>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #f8f9fb;
      --surface: #ffffff;
      --text: #1a1d26;
      --text-muted: #6b7280;
      --border: #e8eaef;
      --shadow: 0 2px 8px rgba(15, 23, 42, 0.06), 0 1px 2px rgba(15, 23, 42, 0.04);
      --shadow-hover: 0 8px 24px rgba(15, 23, 42, 0.1), 0 2px 6px rgba(15, 23, 42, 0.05);
      --preview-bg: #e5e7eb;
      --preview-border: #d1d5db;
      --radius: 14px;
      --radius-sm: 8px;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      max-width: 1120px;
      margin: 0 auto;
      padding: 48px 24px 80px;
    }

    /* Header */
    .header {
      text-align: center;
      margin-bottom: 56px;
    }

    .header h1 {
      font-size: clamp(1.75rem, 4vw, 2.25rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 10px;
    }

    .header p {
      color: var(--text-muted);
      font-size: 1.05rem;
      font-weight: 400;
    }

    /* Section */
    .section {
      margin-bottom: 52px;
    }

    .section-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 22px;
      padding: 8px 12px;
      margin-left: -12px;
      margin-right: -12px;
      border-radius: var(--radius-sm);
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      user-select: none;
      transition: background 0.15s ease;
    }

    .section-header:hover {
      background: var(--surface);
    }

    .section-chev-wrap {
      margin-left: 10px;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--bg);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .section-header:hover .section-chev-wrap {
      background: #fff;
      border-color: var(--text-muted);
    }

    .section-chev {
      font-size: 1.3rem;
      line-height: 1;
      color: var(--text-muted);
      transition: transform 0.2s ease, color 0.15s ease;
    }

    .section-header:hover .section-chev {
      color: var(--text);
    }

    .section.collapsed .section-chev {
      transform: rotate(-90deg);
    }

    .section-body {
      overflow: hidden;
    }

    .section.collapsed .section-body {
      display: none;
    }

    .section-badge {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      font-weight: 700;
      color: #fff;
      flex-shrink: 0;
    }

    .section-title {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .section-count {
      margin-left: auto;
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* Verification status badge */
    .status-badge {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .status-ok {
      color: #047a43;
      background: #e8f9f0;
      border: 1px solid #c4ecd6;
    }

    .status-tbd {
      color: #b45309;
      background: #fef3c7;
      border: 1px solid #fde68a;
    }

    .status-std {
      color: #1d4ed8;
      background: #eff4ff;
      border: 1px solid #c9d9fb;
    }

    .section-meta {
      margin: -10px 0 20px;
      padding: 14px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 0.8125rem;
      color: var(--text-muted);
      line-height: 1.65;
    }

    .section-meta strong {
      color: var(--text);
      font-weight: 600;
    }

    /* Product group (within a section) */
    .group {
      margin-top: 28px;
    }

    .group:first-of-type {
      margin-top: 4px;
    }

    .group-header {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 4px 10px;
      margin-bottom: 13px;
    }

    .group-title {
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .group-note {
      font-size: 0.78rem;
      color: var(--text-muted);
      line-height: 1.5;
    }

    /* Card grid */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 18px;
    }

    /* Card */
    .card {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: box-shadow 0.2s ease, transform 0.2s ease;
    }

    .card:hover {
      box-shadow: var(--shadow-hover);
      transform: translateY(-2px);
    }

    .preview-wrap {
      width: 100%;
      height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
    }

    .preview {
      background: var(--preview-bg);
      border: 1.5px dashed var(--preview-border);
      border-radius: var(--radius-sm);
      max-width: 100%;
      max-height: 100%;
    }

    /* Real example thumbnail (e.g. Kakao Bizboard types) */
    .preview-img {
      width: 100%;
      height: auto;
      max-height: 100%;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      object-fit: cover;
    }

    .size {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      margin-bottom: 4px;
      font-variant-numeric: tabular-nums;
    }

    /* Toast */
    .toast {
      position: fixed;
      left: 50%;
      bottom: 32px;
      transform: translateX(-50%) translateY(12px);
      z-index: 100;
      padding: 10px 20px;
      background: var(--text);
      color: #fff;
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 999px;
      box-shadow: var(--shadow-hover);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      font-variant-numeric: tabular-nums;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .name {
      font-size: 0.875rem;
      color: var(--text-muted);
      font-weight: 500;
      text-align: center;
    }

    .note {
      margin-top: 6px;
      font-size: 0.75rem;
      color: #9ca3af;
      text-align: center;
      line-height: 1.45;
    }

    /* PSD download button */
    .psd-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 10px;
      width: 124px;
      padding: 7px 0;
      box-sizing: border-box;
      font-size: 0.78rem;
      font-weight: 600;
      color: #1f2937;
      background: #eef2ff;
      border: 1px solid #dadffb;
      border-radius: 999px;
      text-decoration: none;
      transition: background 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
    }

    .psd-btn:hover {
      background: #e0e7ff;
      border-color: #c3cbfa;
      transform: translateY(-1px);
    }

    .psd-btn svg {
      width: 13px;
      height: 13px;
      flex-shrink: 0;
    }

    /* Production guide (accordion) */
    .guide-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 16px;
      padding: 8px 16px;
      font-size: 0.82rem;
      font-weight: 600;
      color: #047a43;
      background: #e8f9f0;
      border: 1px solid #c4ecd6;
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.15s ease;
      font-family: inherit;
    }

    .guide-btn:hover { background: #d6f3e5; }

    .guide-btn .chev { transition: transform 0.2s ease; font-size: 0.7rem; }
    .guide-btn[aria-expanded="true"] .chev { transform: rotate(180deg); }

    /* Per-size guide button (on card) */
    .size-guide-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 10px;
      width: 124px;
      padding: 7px 0;
      box-sizing: border-box;
      font-size: 0.78rem;
      font-weight: 600;
      color: #047a43;
      background: #e8f9f0;
      border: 1px solid #c4ecd6;
      border-radius: 999px;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.15s ease;
    }
    .size-guide-btn:hover { background: #d6f3e5; }
    .size-guide-btn .chev { transition: transform 0.2s ease; font-size: 0.9rem; position: relative; top: -1.5px; }
    .size-guide-btn[aria-expanded="true"] .chev { transform: rotate(180deg); }
    .size-guide-btn[aria-expanded="true"] { background: #047a43; color: #fff; border-color: #047a43; }

    /* Artboard cart button (on card) */
    .cart-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      margin-top: 10px;
      width: 124px;
      padding: 7px 0;
      box-sizing: border-box;
      font-size: 0.78rem;
      font-weight: 600;
      color: #4b5563;
      background: #fff;
      border: 1px dashed #c7cdd8;
      border-radius: 999px;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    }
    .cart-btn:hover { background: #f3f4f6; border-color: #9aa3b2; color: var(--text); }
    .cart-btn.added { background: var(--text); color: #fff; border: 1px solid var(--text); }

    /* Artboard cart bar (fixed bottom) */
    .cartbar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 60;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 14px;
      padding: 12px 20px;
      background: #fff;
      border-top: 1px solid var(--border);
      box-shadow: 0 -6px 24px rgba(15, 23, 42, 0.08);
    }
    .cartbar[hidden] { display: none; }

    .cart-title {
      font-size: 0.82rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .cart-chips {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      flex: 1;
      padding: 2px 0;
    }
    .cart-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 11px;
      background: #f3f4f6;
      border: 1px solid var(--border);
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }
    .cart-chip button {
      border: none;
      background: none;
      cursor: pointer;
      color: #9ca3af;
      font-size: 0.8rem;
      padding: 0;
      line-height: 1;
      font-family: inherit;
    }
    .cart-chip button:hover { color: #ef4444; }

    .cart-input {
      width: 108px;
      padding: 8px 13px;
      border: 1px solid var(--border);
      border-radius: 999px;
      font-family: inherit;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text);
      background: var(--bg);
      outline: none;
      transition: border-color 0.15s ease, background 0.15s ease;
    }
    .cart-input:focus { border-color: #9aa3b2; background: #fff; }
    .cart-input::placeholder { color: #9ca3af; font-weight: 500; }

    .cart-input-date {
      width: 88px;
      font-variant-numeric: tabular-nums;
    }

    .cart-clear {
      border: none;
      background: none;
      color: var(--text-muted);
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      white-space: nowrap;
    }
    .cart-clear:hover { color: #ef4444; }

    .cart-dl {
      border: none;
      background: var(--text);
      color: #fff;
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 700;
      padding: 9px 18px;
      border-radius: 999px;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity 0.15s ease;
    }
    .cart-dl:hover { opacity: 0.85; }

    body.cart-open { padding-bottom: 72px; } /* 바구니 바에 푸터 안 가리게 */
    body.cart-open .toast { bottom: 96px; }

    @media (max-width: 640px) {
      .cartbar { flex-wrap: wrap; gap: 10px; padding: 10px 14px; }
      .cart-chips { flex-basis: 100%; order: 3; }
    }

    .guide-panel {
      margin-top: 16px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: #fbfcfe;
      padding: 26px 28px;
      display: none;
    }

    .guide-panel.open { display: block; }

    .guide-body {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
    }

    @media (max-width: 720px) {
      .guide-body { grid-template-columns: 1fr; gap: 22px; }
    }

    .guide-sec h4 {
      font-size: 0.95rem;
      font-weight: 800;
      margin-bottom: 14px;
      padding-bottom: 8px;
      border-bottom: 2px solid #03c75a;
      display: inline-block;
    }

    .spec-block { margin-bottom: 18px; }
    .spec-block:last-child { margin-bottom: 0; }

    .spec-label {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 7px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .badge-req, .badge-rec {
      font-size: 0.65rem;
      font-weight: 700;
      color: #fff;
      padding: 1px 7px;
      border-radius: 999px;
    }
    .badge-req { background: #ef4444; }
    .badge-rec { background: #6366f1; }

    .spec-block ul {
      list-style: none;
      font-size: 0.82rem;
      color: #374151;
      line-height: 1.75;
    }
    .spec-block li::before { content: "· "; color: #9ca3af; }
    .spec-block p,
    .guide-sec > p {
      font-size: 0.82rem;
      color: #4b5563;
      line-height: 1.65;
      margin-top: 8px;
    }
    .spec-block .hl { color: #ef4444; font-weight: 600; }
    .spec-block strong { color: var(--text); font-weight: 600; }

    .swatches { display: flex; gap: 8px; margin-top: 10px; }
    .swatches span {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 1px solid rgba(0,0,0,0.08);
    }

    .guide-img {
      display: block;
      max-width: 200px;
      width: 100%;
      margin-top: 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    .guide-img.wide { max-width: 100%; }
    .guide-img-cap {
      margin-top: 5px;
      font-size: 0.7rem;
      color: #9ca3af;
    }

    /* Example images (03) — full-width row */
    .guide-sec.full { grid-column: 1 / -1; }

    /* 반려 사례 메모 — 공식 가이드 아님, 실전 반려 기록용 포스트잇 */
    .memo-box {
      grid-column: 1 / -1;
      background: #fffbeb;
      border: 1px solid #fde68a;
      border-left: 4px solid #f59e0b;
      border-radius: var(--radius-sm);
      padding: 14px 18px;
    }

    .memo-box .memo-title {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.82rem;
      font-weight: 700;
      color: #92400e;
      margin-bottom: 6px;
    }

    .memo-box .memo-title .memo-sub {
      font-weight: 500;
      color: #b45309;
      font-size: 0.76rem;
    }

    .memo-box ul {
      list-style: none;
      font-size: 0.85rem;
      color: #78350f;
    }

    .memo-box ul li {
      padding-left: 16px;
      position: relative;
    }

    .memo-box ul li::before {
      content: "·";
      position: absolute;
      left: 4px;
      font-weight: 700;
    }

    .ex-row {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }
    .ex-fig {
      flex: 1 1 280px;
      max-width: 360px;
    }
    .ex-fig img {
      display: block;
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    .ex-fig figcaption {
      margin-top: 6px;
      font-size: 0.72rem;
      color: #9ca3af;
    }

    /* Platform colors */
    .badge-google { background: linear-gradient(135deg, #4285f4, #34a853); }
    .badge-meta   { background: linear-gradient(135deg, #1877f2, #833ab4); }
    .badge-moloco { background: linear-gradient(135deg, #ff6b35, #f7931e); }
    .badge-kakao  { background: linear-gradient(135deg, #fee500, #f5c800); color: #3c1e1e; }
    .badge-naver  { background: linear-gradient(135deg, #03c75a, #00a84d); }

    /* Footer */
    .footer {
      text-align: center;
      margin-top: 20px;
      padding-top: 32px;
      border-top: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    @media (max-width: 480px) {
      .page {
        padding: 32px 16px 60px;
      }

      .card-grid {
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 14px;
      }

      .card {
        padding: 16px;
      }

      .preview-wrap {
        height: 100px;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="header">
      <h1>매체 가이드 모음.zip</h1>
      <p>매체별 대표 배너 규격을 한눈에 확인하세요</p>
    </header>

    <main id="app"></main>

    <footer class="footer">
      필요한 매체·사이즈가 없다면 <strong>경은 (디자인1팀)</strong>에게 요청해 주세요. 확인 후 업데이트하겠습니다.
    </footer>
  </div>

  <div class="cartbar" id="cartbar" hidden>
    <span class="cart-title">아트보드 <span id="cartCount">0</span>개</span>
    <div class="cart-chips" id="cartChips"></div>
    <input class="cart-input cart-input-date" id="cartDate" type="text" placeholder="날짜" spellcheck="false">
    <input class="cart-input" id="cartBrand" type="text" placeholder="브랜드명" spellcheck="false">
    <input class="cart-input" id="cartAppeal" type="text" placeholder="소구점" spellcheck="false">
    <button class="cart-clear" type="button" onclick="clearCart()">비우기</button>
    <button class="cart-dl" type="button" onclick="downloadPsd()">PSD 다운로드</button>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    // M 피드 공통(사이즈 무관) 가이드 — 각 사이즈 패널에서 재사용
    const MFEED_LIMIT = (extra = "") => `
      <div class="spec-block">
        <div class="spec-label">제한 <span class="badge-req">필수</span></div>
        <ul>
          <li>이미지 내 텍스트 면적은 전체의 <strong>최대 20%</strong></li>
          <li>메인 이미지 테두리 삽입 불가</li>
          <li>여백에 흰색·미색 바탕 사용 불가 (영역 가득 채움)</li>
          ${extra}
        </ul>
      </div>`;
    const MFEED_TEXT = (extra = "") => `
      <div class="guide-sec">
        <h4>02. 텍스트 가이드</h4>
        <div class="spec-block">
          <div class="spec-label">글자수</div>
          <ul>
            <li>프로필 이름 : 최대 19자 (띄어쓰기 포함)</li>
            <li>광고 문구 : 최대 65자 (띄어쓰기 포함)</li>
            ${extra}
          </ul>
        </div>

              { w: 600, h: 600, name: "빅배너 (기본형)", token: "웹툰빅배너", note: "제작 사이즈 · JPG/PNG · 200KB 미만 · 테두리 필수" },
            ],
            details: `
              <div class="guide-sec">
                <h4>01. 이미지 가이드</h4>
                <div class="spec-block">
                  <div class="spec-label">Size <span class="badge-req">필수</span></div>
                  <ul>
                    <li>제작 사이즈 : <span class="hl">600×600 px</span></li>
                    <li>파일 타입 : JPG, PNG</li>
                    <li>파일 용량 : 200KB 미만</li>
                  </ul>
                  <p>600×600 한 가지 사이즈로 작업해 등록하면 PC·모바일 환경에 맞게 자동 리사이징되어 노출됩니다.</p>
                </div>
                <div class="spec-block">
                  <div class="spec-label">Border <span class="badge-req">필수</span></div>
                  <p>배너 이미지에는 굵기 <strong>1px / 컬러 #000000 / Alpha 15%</strong>의 테두리(border)를 반드시 포함해야 합니다.</p>
                </div>
                <div class="spec-block">
                  <div class="spec-label">Color</div>
                  <p>규격 내 자유롭게 구성하되 <strong>광고와 조화로운 배경을 반드시 삽입</strong>합니다. 이미지 / 단색(화이트·블랙 포함) / 패턴 배경 모두 가능하며, 그라데이션은 <strong>투톤으로만</strong> 구성하고 지나치게 채도 높은 컬러는 지양합니다.</p>
                  <div class="swatches">
                    <span style="background:#ff00aa"></span>
                    <span style="background:#00c2d1"></span>
                    <span style="background:#22c55e"></span>
                    <span style="background:#ffe000"></span>
                  </div>
                </div>
              </div>
              <div class="guide-sec">
                <h4>02. 텍스트 가이드</h4>
                <div class="spec-block">
                  <div class="spec-label">Spec <span class="badge-rec">권장</span></div>
                  <ul>
                    <li>① 광고주 브랜드 로고</li>
                    <li>② 소재를 설명하는 타이틀 혹은 서브카피</li>
                    <li>③ 버튼 (클릭 유도)</li>
                  </ul>
                  <img class="guide-img" src="assets/img/webtoon-spec-sample.png" alt="웹툰 빅배너 샘플 — 로고/타이틀·서브카피/버튼 구성 예시" loading="lazy">
                  <p class="guide-img-cap">샘플 배너 예시 (①로고 ②타이틀·서브카피 ③버튼)</p>
                </div>
                <div class="spec-block">
                  <div class="spec-label">Size <span class="badge-rec">권장</span></div>
                  <ul>
                    <li>타이틀 : 최소 32pt</li>
                    <li>서브 카피 : 최소 16pt</li>
                    <li>심의필 : 14pt</li>
                  </ul>
                  <p>위 사이즈 이상으로 제작해야 모바일에서도 잘 보입니다. (해상도 72dpi 기준)</p>
                  <img class="guide-img" src="assets/img/webtoon-text-size.png" alt="타이틀 32pt / 서브카피 16pt 크기 예시" loading="lazy">
                  <p class="guide-img-cap">타이틀 32pt · 서브카피 16pt · 폰트 예) Rix고딕/DIN</p>
                </div>
                <div class="spec-block">
                  <div class="spec-label">Color &amp; Layout</div>
                  <p>텍스트는 기본 1종 + 포인트 컬러 2종 이내(총 3색 이내)를 권장합니다. 정렬은 되도록 한 방향으로 통일하면 광고 영역을 더 효율적으로 활용할 수 있습니다.</p>
                </div>
                <div class="spec-block">
                  <div class="spec-label">Font</div>
                  <p>폰트는 2가지 이내 권장. 영어·숫자는 추가 1종 사용 무방. 예) 한글 Rix고딕 / 영문·숫자 DIN</p>
                </div>
              </div>`,
          },
        ],
      },
    ];

    function calcPreviewSize(w, h, maxW, maxH) {
      const ratio = w / h;
      let width, height;

      if (ratio >= 1) {
        width = Math.min(maxW, maxH * ratio);
        height = width / ratio;
        if (height > maxH) {
          height = maxH;
          width = height * ratio;
        }
      } else {
        height = Math.min(maxH, maxW / ratio);
        width = height * ratio;
        if (width > maxW) {
          width = maxW;
          height = width / ratio;
        }
      }

      return { width: Math.round(width), height: Math.round(height) };
    }

    const DOWNLOAD_ICON =
      '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v8m0 0L4.5 6.5M8 10l3.5-3.5M2.5 13h11"/></svg>';

    function renderCard(banner, guideId, details, platformName) {
      const { width, height } = calcPreviewSize(banner.w, banner.h, 160, 110);
      const note = banner.note ? `<p class="note">${banner.note}</p>` : "";
      const psd = banner.psd
        ? `<a class="psd-btn" href="${banner.psd}" target="_blank" rel="noopener">제작 PSD${DOWNLOAD_ICON}</a>`
        : "";
      const guideBtn = (guideId && details)
        ? `<button class="size-guide-btn" type="button" aria-expanded="false" onclick="toggleSizeGuide('${guideId}', this)">제작 가이드<span class="chev">▾</span></button>`
        : "";
      // 매체명 포함 → 매체 간 동일 사이즈·이름 충돌 방지. label은 화면 표시용, token은 파일명용
      const label = `${platformName ? platformName + " " : ""}${banner.name} ${banner.w}x${banner.h}`;
      const token = banner.token || banner.name.replace(/\([^)]*\)/g, "").replace(/[^0-9A-Za-z가-힣]/g, "");
      const safeAttr = banner.safe ? `${banner.safe.t},${banner.safe.b},${banner.safe.l},${banner.safe.r}` : "";
      const cartBtn = `<button class="cart-btn" type="button" data-label="${label}" data-token="${token}" data-platform="${platformName || ""}" data-w="${banner.w}" data-h="${banner.h}" data-safe="${safeAttr}" onclick="toggleCart(this)">＋ 아트보드 담기</button>`;
      // 실제 예시 이미지가 있으면(카카오 비즈보드 유형 등) 회색 미리보기 대신 이미지 표시
      const preview = banner.img
        ? `<img class="preview-img" src="${banner.img}" alt="${banner.name} 예시" loading="lazy">`
        : `<div class="preview" style="width:${width}px;height:${height}px" aria-hidden="true"></div>`;
      return `
        <article class="card">
          <div class="preview-wrap">
            ${preview}
          </div>
          <p class="size">${banner.w}×${banner.h}</p>
          <p class="name">${banner.name}</p>
          ${note}
          ${psd}
          ${guideBtn}
          ${cartBtn}
        </article>
      `;
    }

    function renderGroup(group, gid, platformName) {
      const note = group.note ? `<span class="group-note">${group.note}</span>` : "";
      const perSize = group.banners.some((b) => b.details);          // M 피드: 사이즈별 가이드
      const sharedId = (!perSize && group.details) ? `${gid}-grp` : null; // 단일/묶음: 공통 가이드(모든 카드가 같은 패널)

      const cards = group.banners
        .map((b, i) => {
          const id = perSize ? `${gid}-b${i}` : sharedId;
          const details = perSize ? b.details : group.details;
          return renderCard(b, id || undefined, details, platformName);
        })
        .join("");

      let panels = "";
      if (perSize) {
        panels = group.banners
          .map((b, i) =>
            b.details ? `<div class="guide-panel" id="${gid}-b${i}"><div class="guide-body">${b.details}</div></div>` : ""
          )
          .join("");
      } else if (sharedId) {
        panels = `<div class="guide-panel" id="${sharedId}"><div class="guide-body">${group.details}</div></div>`;
      }

      return `
        <div class="group">
          <div class="group-header">
            <h3 class="group-title">${group.title}</h3>
            ${note}
          </div>
          <div class="card-grid">
            ${cards}
          </div>
          ${panels}
        </div>
      `;
    }

    function toggleSizeGuide(id, btn) {
      const panel = document.getElementById(id);
      const group = btn.closest(".group");
      const thisActive = btn.getAttribute("aria-expanded") === "true";
      // 그룹 내 모든 버튼 비활성화
      group.querySelectorAll('.size-guide-btn[aria-expanded="true"]').forEach((b) =>
        b.setAttribute("aria-expanded", "false")
      );
      if (thisActive) {
        panel.classList.remove("open"); // 같은 버튼 재클릭 → 닫기
      } else {
        // 다른 패널 닫고 대상 패널 열기 + 이 버튼 활성 (공통 패널이면 버튼만 전환)
        group.querySelectorAll(".guide-panel.open").forEach((p) => { if (p !== panel) p.classList.remove("open"); });
        panel.classList.add("open");
        btn.setAttribute("aria-expanded", "true");
        panel.scrollIntoView({ block: "nearest", behavior: "smooth" });
      }
    }

    // 평면(banners) 섹션 — 특정 사이즈에 details가 있으면 그 카드에 사이즈별 가이드 패널을 붙임
    function renderFlat(platform) {
      const gid = platform.id;
      const perSize = platform.banners.some((b) => b.details);
      const cards = platform.banners
        .map((b, i) => renderCard(b, perSize && b.details ? `${gid}-b${i}` : undefined, b.details, platform.name))
        .join("");
      const panels = perSize
        ? platform.banners
            .map((b, i) =>
              b.details ? `<div class="guide-panel" id="${gid}-b${i}"><div class="guide-body">${b.details}</div></div>` : ""
            )
            .join("")
        : "";
      return `<div class="group"><div class="card-grid">${cards}</div>${panels}</div>`;
    }

    function renderSection(platform) {
      const guide = platform.guide
        ? `<p class="section-meta">${platform.guide}</p>`
        : "";
      const count = platform.groups
        ? platform.groups.reduce((n, g) => n + g.banners.length, 0)
        : platform.banners.length;
      const body = platform.groups
        ? platform.groups.map((g, i) => renderGroup(g, `${platform.id}-g${i}`, platform.name)).join("")
        : renderFlat(platform);
      const status = platform.verified
        ? '<span class="status-badge status-ok">공식 가이드 반영 ✓</span>'
        : platform.standard
        ? '<span class="status-badge status-std">표준 규격</span>'
        : '<span class="status-badge status-tbd">참고용 · 검증 전</span>';
      return `
        <section class="section" id="${platform.id}">
          <div class="section-header" onclick="toggleSection('${platform.id}')">
            <div class="section-badge ${platform.badgeClass}">${platform.name.slice(0, 1)}</div>
            <h2 class="section-title">${platform.name}</h2>
            ${status}
            <span class="section-count">${count}종</span>
            <span class="section-chev-wrap"><span class="section-chev">▾</span></span>
          </div>
          <div class="section-body">
            ${guide}
            ${body}
          </div>
        </section>
      `;
    }

    // 매체 섹션 접기/펼치기 — 상태는 localStorage에 저장해 새로고침해도 유지
    const COLLAPSE_KEY = "cheatsheet-collapsed-sections";
    function loadCollapsedSections() {
      try {
        return new Set(JSON.parse(localStorage.getItem(COLLAPSE_KEY) || "[]"));
      } catch (e) {
        return new Set();
      }
    }
    function saveCollapsedSections(set) {
      try {
        localStorage.setItem(COLLAPSE_KEY, JSON.stringify([...set]));
      } catch (e) {}
    }
    function toggleSection(id) {
      const section = document.getElementById(id);
      const collapsed = loadCollapsedSections();
      if (collapsed.has(id)) {
        collapsed.delete(id);
        section.classList.remove("collapsed");
      } else {
        collapsed.add(id);
        section.classList.add("collapsed");
      }
      saveCollapsedSections(collapsed);
    }

    document.getElementById("app").innerHTML = platforms.map(renderSection).join("");

    // 새로고침 후에도 이전에 접어둔 섹션 상태 복원. 첫 방문(저장값 없음)엔 전체 접힌 채로 시작
    (() => {
      let isFirstVisit;
      try {
        isFirstVisit = localStorage.getItem(COLLAPSE_KEY) === null;
      } catch (e) {
        isFirstVisit = false;
      }
      const collapsed = isFirstVisit ? new Set(platforms.map((p) => p.id)) : loadCollapsedSections();
      if (isFirstVisit) saveCollapsedSections(collapsed);
      collapsed.forEach((id) => {
        const section = document.getElementById(id);
        if (section) section.classList.add("collapsed");
      });
    })();

    // 날짜 입력칸 placeholder에 오늘 날짜 표시 — 비워두면 이 값이 파일명에 자동 사용됨
    document.getElementById("cartDate").placeholder = todayYYMMDD();

    // 토스트 알림 (포토샵 스크립트 다운로드 완료 메시지 등에 사용)
    let toastTimer;
    function showToast(msg) {
      const toast = document.getElementById("toast");
      toast.textContent = msg;
      toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove("show"), 1600);
    }

    // 아트보드 바구니 — 담은 사이즈들로 포토샵 스크립트(.jsx) 생성
    const cart = [];

    function toggleCart(btn) {
      const label = btn.dataset.label;
      const i = cart.findIndex((c) => c.label === label);
      if (i >= 0) {
        cart.splice(i, 1);
      } else {
        cart.push({
          label,
          token: btn.dataset.token,
          platform: btn.dataset.platform,
          w: Number(btn.dataset.w),
          h: Number(btn.dataset.h),
          safe: btn.dataset.safe ? btn.dataset.safe.split(",").map(Number) : null, // [상, 하, 좌, 우]
        });
      }
      syncCartButtons();
      renderCart();
    }

    function removeFromCart(label) {
      const i = cart.findIndex((c) => c.label === label);
      if (i >= 0) cart.splice(i, 1);
      syncCartButtons();
      renderCart();
    }

    function clearCart() {
      cart.length = 0;
      syncCartButtons();
      renderCart();
    }

    function syncCartButtons() {
      document.querySelectorAll(".cart-btn").forEach((b) => {
        const added = cart.some((c) => c.label === b.dataset.label);
        b.classList.toggle("added", added);
        b.textContent = added ? "✓ 담김" : "＋ 아트보드 담기";
      });
    }

    function renderCart() {
      const bar = document.getElementById("cartbar");
      bar.hidden = cart.length === 0;
      document.body.classList.toggle("cart-open", cart.length > 0);
      document.getElementById("cartCount").textContent = cart.length;
      document.getElementById("cartChips").innerHTML = cart
        .map(
          (c) =>
            `<span class="cart-chip">${c.label}<button type="button" onclick="removeFromCart('${c.label.replace(/'/g, "\\'")}')" aria-label="${c.label} 빼기">✕</button></span>`
        )
        .join("");
    }

    // 파일명 규칙: 오늘날짜_브랜드명_소구점_매체명_상품명_사이즈 (예: 260707_브랜드명_소구점_네이버_스페셜DA_750x280)
    function fileToken(value, fallback) {
      const t = (value || "").trim().replace(/[\s_/\\:*?"<>|]+/g, ""); // 구분자·파일명 금지 문자 제거
      return t || fallback;
    }

    function artboardName(item, date, brand, appeal) {
      return `${date}_${brand}_${appeal}_${item.platform}_${item.token}_${item.w}x${item.h}`;
    }

    function describeSafe(s) {
      const [t, b, l, r] = s;
      if (t === b && b === l && l === r) return `여백 ${t}px`;
      const parts = [];
      if (t) parts.push(`상${t}`);
      if (b) parts.push(`하${b}`);
      if (l) parts.push(`좌${l}`);
      if (r) parts.push(`우${r}`);
      return parts.join("·") + "px";
    }

    function todayYYMMDD() {
      const now = new Date();
      return (
        String(now.getFullYear() % 100).padStart(2, "0") +
        String(now.getMonth() + 1).padStart(2, "0") +
        String(now.getDate()).padStart(2, "0")
      );
    }

    // ag-psd로 아트보드 포함 PSD를 브라우저에서 직접 생성 (담은 사이즈를 가로로 나열)
    function buildPsd(items) {
      const GAP = 100;
      let totalW = 0, maxH = 0;
      items.forEach((it, i) => { totalW += it.w + (i > 0 ? GAP : 0); if (it.h > maxH) maxH = it.h; });

      const children = [];
      let x = 0;
      items.forEach((it) => {
        const abChildren = [];
        // Safe Area — 여백을 빨간 반투명(45%)으로 굽고 가운데는 비움 (내보내기 전 삭제 레이어)
        if (it.safe) {
          const c = document.createElement("canvas");
          c.width = it.w; c.height = it.h;
          const ctx = c.getContext("2d");
          ctx.fillStyle = "rgba(234,51,35,0.45)";
          ctx.fillRect(0, 0, it.w, it.h);
          const mt = it.safe[0], mb = it.safe[1], ml = it.safe[2], mr = it.safe[3];
          ctx.clearRect(ml, mt, it.w - ml - mr, it.h - mt - mb);
          abChildren.push({
            name: "※ Safe Area " + it.safeDesc + " (내보내기 전 삭제)",
            canvas: c,
            left: x, top: 0,
          });
        }
        children.push({
          name: it.name,
          artboard: {
            rect: { top: 0, left: x, bottom: it.h, right: x + it.w },
            presetName: it.name,
            color: { r: 255, g: 255, b: 255, a: 255 }, // 아트보드 배경 흰색
          },
          children: abChildren,
        });
        x += it.w + GAP;
      });

      return agPsd.writePsd({
        width: totalW || 1,
        height: maxH || 1,
        children: children,
        artboards: { count: items.length },
      });
    }

    function downloadPsd() {
      if (!cart.length) return;
      if (typeof agPsd === "undefined" || !agPsd.writePsd) {
        showToast("PSD 모듈 로드 실패 · 인터넷 연결 후 새로고침하세요");
        return;
      }
      const date = fileToken(document.getElementById("cartDate").value, todayYYMMDD());
      const brand = fileToken(document.getElementById("cartBrand").value, "브랜드명");
      const appeal = fileToken(document.getElementById("cartAppeal").value, "소구점");
      const items = cart.map((c) => ({
        name: artboardName(c, date, brand, appeal),
        w: c.w,
        h: c.h,
        safe: c.safe,
        safeDesc: c.safe ? describeSafe(c.safe) : "",
      }));
      const media = [...new Set(cart.map((c) => c.platform))].join("+");
      const baseName = `${date}_${brand}_${appeal}_${media}_${cart.length}종`;
      let buffer;
      try {
        buffer = buildPsd(items);
      } catch (e) {
        showToast("PSD 생성 오류: " + e.message);
        return;
      }
      const blob = new Blob([buffer], { type: "application/octet-stream" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = baseName + ".psd";
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 3000);
      showToast("PSD 다운로드됨 · 더블클릭으로 열기");
    }

  </script>
